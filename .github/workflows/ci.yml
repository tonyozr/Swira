name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # On Linux and Windows, install a specific Swift toolchain (neither runner ships one).
      # On macOS, skip this step — the runner's Xcode-bundled Swift is SDK-matched and using
      # a standalone swift.org toolchain alongside a newer Xcode SDK causes module-build
      # failures (e.g. _Builtin_float errors from mismatched clang headers).
      - name: Set up Swift
        if: runner.os != 'macOS'
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: "6.1"

      - name: swift --version
        run: swift --version

      # `make` isn't part of the Windows runner image (unlike Linux/macOS, where it's already
      # on PATH) — see the Makefile's own notes on Windows lacking POSIX tooling by default.
      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      # `make build`/`make test` cover everything buildable on the current platform — on
      # Windows that includes Apps/SwiraWin via dotnet, which is why this is one job per OS
      # rather than a Swift-only matrix plus a separate Windows-only job.
      - name: Build
        run: make build

      - name: Test
        run: make test
